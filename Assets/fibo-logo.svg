<?xml version="1.0" encoding="UTF-8"?>
<!-- Fibo — znak "złote kafle": podział złotego prostokąta 13×8 na kwadraty
     8 5 3 2 1 1 (ciąg Fibonacciego) + złota spirala z ćwierćłuków.
     Kafle: złoto z malejącym kryciem; spirala: jasne złoto. Tło przezroczyste,
     projektowane na ciemny grunt (wersja jasna: patrz fibo-logo-light.svg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 90" width="280" height="180">
  <g transform="translate(5,5)">
    <rect x="1"   y="1"  width="78" height="78" rx="4" fill="#e0b64b" opacity="0.94"/>
    <rect x="81"  y="1"  width="48" height="48" rx="4" fill="#e0b64b" opacity="0.83"/>
    <rect x="101" y="51" width="28" height="28" rx="3" fill="#e0b64b" opacity="0.72"/>
    <rect x="81"  y="61" width="18" height="18" rx="3" fill="#e0b64b" opacity="0.61"/>
    <rect x="81"  y="51" width="8"  height="8"  rx="2" fill="#e0b64b" opacity="0.50"/>
    <rect x="91"  y="51" width="8"  height="8"  rx="2" fill="#e0b64b" opacity="0.39"/>
    <path d="M 0 80
             A 80 80 0 0 1 80 0
             A 50 50 0 0 1 130 50
             A 30 30 0 0 1 100 80
             A 20 20 0 0 1 80 60
             A 10 10 0 0 1 90 50"
          fill="none" stroke="#f0d488" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>

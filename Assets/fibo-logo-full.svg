<?xml version="1.0" encoding="UTF-8"?>
<!-- Fibo — pełny lockup: znak "złote kafle" + wordmark "fibo" + "GOLDEN FIBO".
     Wordmark na stacku systemowym (docelowo krój geometryczny, np. Futura /
     Josefin Sans / Poppins Light). Na ciemny grunt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110">
  <g transform="translate(8,10)">
    <rect x="1"   y="1"  width="78" height="78" rx="4" fill="#e0b64b" opacity="0.94"/>
    <rect x="81"  y="1"  width="48" height="48" rx="4" fill="#e0b64b" opacity="0.83"/>
    <rect x="101" y="51" width="28" height="28" rx="3" fill="#e0b64b" opacity="0.72"/>
    <rect x="81"  y="61" width="18" height="18" rx="3" fill="#e0b64b" opacity="0.61"/>
    <rect x="81"  y="51" width="8"  height="8"  rx="2" fill="#e0b64b" opacity="0.50"/>
    <rect x="91"  y="51" width="8"  height="8"  rx="2" fill="#e0b64b" opacity="0.39"/>
    <path d="M 0 80
             A 80 80 0 0 1 80 0
             A 50 50 0 0 1 130 50
             A 30 30 0 0 1 100 80
             A 20 20 0 0 1 80 60
             A 10 10 0 0 1 90 50"
          fill="none" stroke="#f0d488" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <text x="168" y="68"
        font-family="Futura, 'Avenir Next', 'Century Gothic', 'URW Gothic', sans-serif"
        font-size="56" font-weight="500" letter-spacing="1" fill="#e8e2d4">fib<tspan fill="#e0b64b">o</tspan></text>
  <text x="170" y="92"
        font-family="Futura, 'Avenir Next', 'Century Gothic', 'URW Gothic', sans-serif"
        font-size="14" font-weight="500" letter-spacing="7" fill="#e0b64b">GOLDEN FIBO</text>
</svg>
